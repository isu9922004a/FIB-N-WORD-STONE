<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N字戰法轉換器 Pro v7.0</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <!-- Libraries (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; user-select: none; -webkit-tap-highlight-color: transparent; }
        textarea { user-select: text; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icons = {
            Sparkles: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-yellow-400"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>,
            File: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>,
            Copy: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>,
            Loader: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-spin text-emerald-400"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            Info: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-blue-400"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        };

        const MARKET_PATTERNS = {
            "強軋空": "⭐️⭐️⭐️ 強軋空盤：多頭動能極強，呈現噴出不回頭之勢，空頭抵抗完全失敗，主力控盤態度堅決，為最強勢之多頭型態。",
            "軋空": "⭐️⭐️ 軋空盤：股價於高檔進行強勢整理，以時間換取空間（以盤代跌），顯示籌碼鎖定良好，空頭抵抗力道轉弱，蓄勢待發。",
            "盤堅": "⭐️ 盤堅盤：股價行進間伴隨 N 字回測以測試支撐，意味著空頭抵抗力道尚存，需透過反覆洗盤消化賣壓，屬穩健推升格局。",
            "強殺多": "⚠️⚠️⚠️ 強殺多（多方完全放棄抵抗）：空方完全主導盤勢，多頭放棄抵抗（常見跳空缺口），股價呈現加速趕底之崩跌樣態。",
            "殺多": "⚠️⚠️ 殺多盤（多方抵抗失敗）：多頭抵抗宣告失敗，反彈無力僅留上影線，籌碼面面臨停損賣壓，修正壓力加劇。",
            "盤跌": "⚠️ 盤跌盤（多方嘗試抵抗）：雖有多頭抵抗試圖反彈，但高點逐步降低，整體趨勢仍受制於空方架構，呈現緩步盤跌。",
            "突破": "🔥 突破盤：股價帶量衝過關鍵壓力區（或跌破支撐），慣性改變，確立新一波趨勢發動，為進場或停損之關鍵訊號。",
            "盤整": "💤 盤整盤：股價受限於箱型區間震盪，多空力道均衡，量能通常萎縮，市場等待表態，屬方向未明之過渡期。"
        };

        function App() {
            const [input, setInput] = useState('');
            const [output, setOutput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [isCopied, setIsCopied] = useState(false);
            const [isOnline, setIsOnline] = useState(navigator.onLine);

            useEffect(() => {
                const updateOnline = () => setIsOnline(navigator.onLine);
                window.addEventListener('online', updateOnline);
                window.addEventListener('offline', updateOnline);
                return () => {
                    window.removeEventListener('online', updateOnline);
                    window.removeEventListener('offline', updateOnline);
                };
            }, []);

            const copyOutput = async () => {
                if (!output) return;
                await navigator.clipboard.writeText(output);
                setIsCopied(true);
                setTimeout(() => setIsCopied(false), 2000);
            };

            const handleClear = () => {
                setInput('');
                setOutput('');
                setIsCopied(false);
            };

            const processRegex = () => {
                if (!input.trim()) return;
                try {
                    // 1. 基礎數值解析
                    const name = (input.match(/股名[：:]\s*([^\d\n\s]+)/) || [])[1] || "該標的";
                    const code = (input.match(/(\d{4})/) || [])[1] || "----";
                    const rawPrice = (input.match(/(?:現價|收盤|最新)[：:]\s*([\d,.]+)/) || [])[1] || "0";
                    const currentPrice = parseFloat(rawPrice.replace(/,/g, '')) || 0;

                    // 2. 價格智能雷達
                    let bLow = null;
                    let bHigh = null;

                    const rangeMatch = input.match(/箱體(?:區間)?[：:]\s*([\d,.]+)[^~]*~\s*([\d,.]+)/);
                    if (rangeMatch) {
                        if (parseFloat(rangeMatch[1]) > 5) bLow = rangeMatch[1];
                        if (parseFloat(rangeMatch[2]) > 5) bHigh = rangeMatch[2];
                    }

                    if (!bLow) bLow = (input.match(/(?:支撐|防守|箱底|軋空低)[^:\d\n]*[:]?\s*([\d,.]+)/) || [])[1];
                    if (!bHigh) bHigh = (input.match(/(?:壓力|箱頂|目標|一飽)[^:\d\n]*[:]?\s*([\d,.]+)/) || [])[1];

                    if (!bLow) bLow = "關鍵支撐";
                    if (!bHigh) bHigh = "關鍵壓力";

                    // 3. 量能數據防呆
                    let vol1 = "特定量能";
                    let vol2 = "更高量能";

                    const extractValidVol = (regex) => {
                        const matches = [...input.matchAll(regex)];
                        for (const m of matches) {
                            const valStr = m[1];
                            const val = parseInt(valStr.replace(/,/g, ''), 10);
                            if (val > 100 && val !== currentPrice) return valStr;
                        }
                        return null;
                    };

                    const attackThresholdMatch = extractValidVol(/攻擊門檻[^\n]*?[:：]\s*([\d,]+)/g); 
                    const estVolMatch = extractValidVol(/預估量[^\n]*?[:>]\s*([\d,]+)/g); 
                    const confirmMatch = extractValidVol(/成交量[^\n]*?[≥>=]\s*([\d,]+)/g);

                    if (attackThresholdMatch) vol1 = attackThresholdMatch;
                    else if (estVolMatch) vol1 = estVolMatch;

                    if (estVolMatch && attackThresholdMatch) {
                        const v1Num = parseInt(vol1.replace(/,/g, ''), 10);
                        const estNum = parseInt(estVolMatch.replace(/,/g, ''), 10);
                        vol2 = estNum > v1Num ? estVolMatch : attackThresholdMatch;
                    } else if (attackThresholdMatch) vol2 = attackThresholdMatch;
                    else if (confirmMatch) vol2 = confirmMatch;
                    else if (estVolMatch) vol2 = estVolMatch;

                    if (vol2 === "更高量能" && vol1 !== "特定量能") vol2 = vol1;

                    // 4. 盤態聖旨鎖定機制 (決定文字走向的核心)
                    let hintList = "";
                    let targetText = "";
                    
                    const definitiveMatch = input.match(/判定本檔個股目前屬於[：:]\s*([^\n]+)/);
                    if (definitiveMatch) {
                        targetText = definitiveMatch[1]; 
                    } else {
                        targetText = input.substring(0, 100); // 擴大掃描範圍
                    }

                    for (const [key, desc] of Object.entries(MARKET_PATTERNS)) {
                        if (targetText.includes(key)) {
                            if (key === "軋空" && targetText.includes("強軋空")) continue;
                            if (key === "殺多" && targetText.includes("強殺多")) continue;
                            hintList = desc; 
                            break; 
                        }
                    }
                    const patternBlock = hintList ? `\n\n【盤態重點提示】\n${hintList}` : "";

                    // ==========================================
                    // 5. V7.0 動態語意路由 (Dynamic Narrative Engine)
                    // ==========================================
                    
                    // 判定市場熱度與方向
                    const isStrong = input.includes("極強") || input.includes("攻擊量") || targetText.includes("軋空") || targetText.includes("突破") || input.includes("死抱不放");
                    const isWeak = targetText.includes("殺多") || targetText.includes("盤跌") || input.includes("停損");
                    
                    let para1, para2, para3;

                    if (isStrong) {
                        // 🟢【強勢攻擊/軋空模式】(符合盛群、台達電的噴出圖形)
                        para1 = `針對${name}（${code}）的技術面觀察顯示，該標的目前正處於「強勢多頭發動」階段，整體型態展現出極強的上攻企圖。當前股價位於 ${rawPrice} 元，已強勢表態並進入攻擊區間。下檔支撐防線已上移至 ${bLow} 元（關鍵防守位），上檔短期目標觀察 ${bHigh} 元。在價格維持在防守位之上時，市場操作指令應順勢偏多，此為獲利極大化的關鍵時刻。技術面強調，只要守穩 ${bLow} 元，軋空或推升的結構就不會被破壞，屬於極度強勢的偏多格局。`;
                        
                        para2 = `從量價結構來看，近期成交量已明顯放大，展現出強勁的「攻擊量能」，反映市場買盤湧入，主力控盤態度堅決。當前量能已滿足攻擊標準，多方動能正在積極釋放中。若要延續此強勢攻勢，必須持續觀察量能是否能穩紮穩打：以前一日的 5 日均量 × 1.3 倍作為基礎攻擊門檻（約 ${vol1} 張）；而更為強勁的續攻條件，則要求成交量能達到 ${vol2} 張以上。在量價配合良好的情況下，不應預設高點，以免過早被洗出場。`;
                        
                        para3 = `針對未來情境之技術邏輯推演，在強勢噴出或盤堅的過程中，最容易犯的錯誤便是「因為怕高而過早獲利了結」。因此，核心戰術結論是「順勢抱牢（Hold）」，直到收盤價出現爆量卻無法創高，或是有效跌破結構防守 ${bLow} 元時，方視為趨勢轉弱的訊號。在強勢期間，應將注意力集中於防守點是否被跌破，只要收盤未破防守，盤中的震盪皆可視為強勢洗盤或換手。`;
                    
                    } else if (isWeak) {
                        // 🔴【弱勢修正模式】
                        para1 = `針對${name}（${code}）的技術面觀察顯示，該標的目前面臨沉重的修正壓力，整體型態定調為「弱勢偏空」。當前股價位於 ${rawPrice} 元，下檔支撐退守至 ${bLow} 元，而上檔壓力則沉積於 ${bHigh} 元。在價格未能站回壓力區間前，市場操作應極度保守。技術面強調，防守要點 ${bLow} 元一旦跌破，將引發進一步的停損賣壓。目前趨勢由空方主導，屬於風險較高的修正格局。`;
                        
                        para2 = `從量價結構來看，若下跌伴隨出量，顯示賣壓正在湧現；若反彈無量，則反映多方承接意願低迷。在量價結構未見明顯「止跌回穩」訊號前，任何反彈皆應視為逃命波。若要扭轉劣勢，成交量必須放大至 ${vol2} 張以上，並且收盤價強勢站回 ${bHigh} 元之上，才能化解破底危機。在滿足這些條件之前，貿然摸底將承受極大風險。`;
                        
                        para3 = `針對未來情境之技術推演，在空方趨勢中，首要任務是資金安全與風險控管。因此，核心戰術結論是「嚴格停損並保持觀望」。若持有部位，應在反彈觸及壓力位 ${bHigh} 元或跌破防守位 ${bLow} 元時果斷減碼。在底部型態確實打底完成前，請耐心等待趨勢明朗，避免接落下的刀子。`;
                    
                    } else {
                        // 🟡【震盪盤整模式】(原本的預設模板)
                        para1 = `針對${name}（${code}）的技術面觀察顯示，該標的目前正處於蓄勢待發的整理階段，整體型態定調為「箱型盤整或震盪走堅」。當前股價位於 ${rawPrice} 元，主要的波動區間被定義在下檔支撐 ${bLow} 元與上檔壓力 ${bHigh} 元之間。在價格未有效表態之前，市場操作指令應保持耐心。技術面強調，防守要點 ${bLow} 元為維持多方架構的關鍵，一旦該點位失守，整理時間將被迫拉長。值得注意的是，目前股價行進間伴隨回測以測試支撐，屬於偏強的洗盤整理。`;
                        
                        para2 = `從量價結構來看，近期成交量呈現相對量縮或量增換手的交替狀態，反映籌碼正在進行深度的沉澱與重新分配，方向即將表態。當前若要確立多頭發動攻勢，必須觀察到強力的「點火訊號」：以前一日的 5 日均量 × 1.3 倍作為短線攻擊的突破門檻（約 ${vol1} 張），並成功突破箱頂壓力 ${bHigh} 元；而更為強勢的確認條件，則要求成交量達到 ${vol2} 張，且收盤價站穩 ${bHigh} 元。在帶量突破之前，應以低接高拋的區間策略為主。`;
                        
                        para3 = `針對未來情境之技術邏輯推演，在價格震盪磨盤的過程中，市場正透過洗盤讓籌碼沉澱。因此，核心戰術結論是耐心等待，直到收盤價有效站穩 ${bHigh} 元，且帶量（>${vol2}張）突破未出現長上影反轉訊號，方視為確立新一波方向。在操作上，應將注意力集中於量能是否能在關鍵壓力位得到有效釋放，並嚴守 ${bLow} 元的防守紀律。`;
                    }

                    const disclaimer = `【免責聲明】本人未持有證券投資顧問相關證照，所載內容僅屬個人技術分析學習紀錄與心得分享，不代表任何買賣建議或獲利保證；過去績效亦不代表未來表現，投資涉及風險，請務必獨立思考、審慎評估並自負盈虧。`;
                    const title = `【${name}${code} 技術面學習筆記】`;
                    const warning = `⚠️ 再次提醒：\n以上純屬個人學習心得，每個人的分析方法、風險承受度都不同，請勿作為投資依據。建議諮詢專業投顧或自行深入研究後再做決定。`;

                    setOutput(`${disclaimer}\n\n${title}\n\n${para1}\n\n${para2}\n\n${para3}${patternBlock}\n\n${warning}`);
                } catch (e) {
                    setOutput(`解析異常：${e.message}。請確認原始數據包含完整價位與量能。`);
                }
            };

            const processAI = async () => {
                if (!isOnline) { setOutput("⚠️ 目前處於離線狀態，AI 功能暫停。"); return; }
                if (!input.trim()) return;
                setIsLoading(true);
                setOutput("正在啟動 AI 進行參數修復與排版優化...");
                
                const apiKey = ""; 
                const systemPrompt = `你是一位極度客觀、嚴謹的市場技術面觀察員。
                任務：將輸入數據轉化為合規的【技術面學習筆記】。
                
                核心指令：
                1. **數值過濾防呆**：抓取量能時，禁止抓取時間格式(如 09:15) 的數字。請確實尋找大於 100 的真實成交量。
                2. **盤態鎖定**：請嚴格尋找「判定本檔個股目前屬於：」這句話並引用定義。若無，則看標題。嚴禁被劇本區的假設性盤態誤導。
                3. **語氣連貫**：必須根據該股目前的「盤勢型態」與「量能狀態」（如：極強攻擊量、突破等），來動態決定內文要寫「強勢突破、量增」還是「整理、量縮」。不可全部套用箱型整理。
                4. **量能定義**：第二段請精準帶入：「前一日 5 日均量 × 1.3 倍的短線攻擊門檻約 XXX 張」。
                5. **定義庫**：${JSON.stringify(MARKET_PATTERNS)}。
                
                結構：開頭免責聲明 -> 現況描述(動態判定強弱) -> 量價結構(動態判定量增縮) -> 戰術推演 -> 【盤態重點提示】(單一鎖定) -> 結尾警語。`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: input }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });
                    const data = await response.json();
                    let aiText = data.candidates[0].content.parts[0].text;
                    setOutput(aiText.replace(/\*\*/g, '')); 
                } catch (err) {
                    setOutput("AI 服務連線失敗，請改用左側快速生成模式。");
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen p-4 md:p-8 flex flex-col items-center">
                    <header className="w-full max-w-4xl text-center mb-8">
                        <h1 className="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400 tracking-tighter">N 字戰法報告轉換器 Pro</h1>
                        <p className="text-slate-500 text-[10px] mt-2 font-mono tracking-widest uppercase">Institutional Technical Report Engine v7.0</p>
                    </header>

                    <main className="w-full max-w-4xl space-y-6">
                        <div className="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-2xl transition-all hover:border-slate-600">
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex items-center gap-2 text-emerald-400 font-bold text-xs uppercase tracking-widest">
                                    <Icons.File /> 步驟 1：輸入原始報告數據
                                </div>
                                <button 
                                    onClick={handleClear}
                                    disabled={!input && !output}
                                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-bold transition-all ${(!input && !output) ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : 'bg-slate-700 hover:bg-rose-600/80 text-slate-300 hover:text-white'}`}
                                >
                                    <Icons.Trash /> 清除前一檔資料
                                </button>
                            </div>
                            <textarea 
                                className="w-full h-44 bg-slate-900/50 border border-slate-700 rounded-xl p-4 text-sm text-slate-300 outline-none focus:border-emerald-500 font-mono transition-all resize-none"
                                placeholder="在此貼上筆記原始內容..."
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                            />
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                            <button onClick={processRegex} className="bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-95 text-sm">
                                直接生成 (動態語意版)
                            </button>
                            <button onClick={processAI} disabled={isLoading} className="bg-gradient-to-r from-indigo-600 to-violet-600 hover:opacity-90 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2 text-sm">
                                {isLoading ? <Icons.Loader /> : <><Icons.Sparkles /> AI 智能生成</>}
                            </button>
                        </div>

                        <div className="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-2xl relative overflow-hidden">
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex items-center gap-2 text-cyan-400 font-bold text-xs uppercase tracking-widest">
                                    <Icons.File /> 步驟 2：獲取專業觀察報告
                                </div>
                                <button 
                                    onClick={copyOutput}
                                    disabled={!output}
                                    className={`flex items-center gap-1.5 px-4 py-2 rounded-full text-[11px] font-bold transition-all ${isCopied ? 'bg-emerald-600 text-white' : 'bg-slate-700 hover:bg-slate-600 text-slate-300'}`}
                                >
                                    {isCopied ? <Icons.Check /> : <Icons.Copy />} {isCopied ? '成功複製' : '複製報告'}
                                </button>
                            </div>
                            <textarea 
                                className="w-full h-[550px] bg-slate-900/50 border border-slate-700 rounded-xl p-6 text-[13px] text-slate-200 outline-none leading-relaxed font-sans scroll-smooth"
                                readOnly
                                value={output}
                                placeholder="等待生成報告內容..."
                            />
                            <div className="mt-4 p-3 bg-slate-900/30 rounded-xl border border-slate-800 flex gap-2">
                                <Icons.Info />
                                <p className="text-[10px] text-slate-500 leading-normal">
                                    v7.0 更新：導入「動態語意路由引擎」，能根據報告中的「極強」、「攻擊量」、「殺多」等關鍵字，自動將內文切換為「強勢攻擊」、「震盪整理」或「弱勢修正」三種截然不同的專業論述，解決圖文不符的問題。
                                </p>
                            </div>
                        </div>
                    </main>

                    <footer className="mt-10 text-[9px] text-slate-600 uppercase tracking-[0.2em] text-center">
                        Market Intelligence Module • Pro v7.0 • Developed for Learning Only
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW Error', err));
            });
        }
    </script>
</body>
</html>
