<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N字戰法觀察報告生成器</title>
    <meta name="theme-color" content="#1a202c">
    <style>
        :root {
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --primary: #2b6cb0;
            --text-main: #2d3748;
            --text-sec: #718096;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
            font-weight: 700;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 20px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-sec);
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            resize: vertical;
            font-size: 14px;
            box-sizing: border-box;
            font-family: monospace;
        }

        button {
            display: block;
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.98);
        }

        #outputArea {
            white-space: pre-wrap;
            font-family: "PingFang TC", "Microsoft JhengHei", serif;
            color: #1a202c;
            line-height: 1.8;
            display: none; /* Hidden by default */
        }

        .copy-btn {
            background-color: #48bb78;
            margin-top: 10px;
            display: none;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #a0aec0;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>N字戰法轉化器 (Institutional)</h1>
    
    <div class="card">
        <label for="inputRaw">輸入原始操盤數據：</label>
        <textarea id="inputRaw" placeholder="請貼上「傑克.史東」或「石頭」的原始 N 字戰法文字..."></textarea>
        <button onclick="generateReport()">轉化為觀察報告</button>
    </div>

    <div class="card" id="resultCard" style="display:none;">
        <label>生成結果：</label>
        <div id="outputArea"></div>
        <button class="copy-btn" id="copyBtn" onclick="copyResult()">複製結果</button>
    </div>

    <div class="footer-note">
        Generated for N-Wave Strategy Analysis
    </div>
</div>

<script>
    function cleanText(text) {
        // 移除所有 emoji
        return text.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '');
    }

    function extractValue(text, regex) {
        const match = text.match(regex);
        return match ? match[1].trim() : null;
    }

    function generateReport() {
        const raw = document.getElementById('inputRaw').value;
        if (!raw) return;

        // 1. 提取關鍵數據
        const stockNameMatch = raw.match(/股名：(.*?)(?:\n|$)/);
        const stockName = stockNameMatch ? stockNameMatch[1].trim() : "未知標的";
        
        const price = extractValue(raw, /現價：\s*([\d,.]+)/) || "----";
        const boxTop = extractValue(raw, /箱體區間.*[~-]\s*([\d,.]+)\s*\(頂\)/) || extractValue(raw, /突破\s*([\d,.]+)/);
        const boxBottom = extractValue(raw, /箱體區間.*：\s*([\d,.]+)\s*\(底\)/) || extractValue(raw, /跌破\s*([\d,.]+)/);
        
        const defense = extractValue(raw, /防守.*：\s*([\d,.]+)/) || boxBottom;
        const avgVol = extractValue(raw, /均量.*量\s*([\d,.]+)\)/);
        const attackVol = extractValue(raw, /攻擊門檻.*：([\d,.]+)/);
        const washVol = extractValue(raw, /洗盤門檻.*：([\d,.]+)/);
        
        // 判斷盤態 (模擬盤整 vs 極強/盤堅)
        let mode = "consolidation"; // 預設盤整
        if (raw.includes("模擬極強") || raw.includes("盤堅盤") || raw.includes("強軋空")) {
            mode = "trend"; // 趨勢盤
        }

        // 判斷型態定調
        let trendStatus = "籌碼沉澱期";
        if (raw.includes("盤堅盤")) trendStatus = "緩步趨堅的主升段格局";
        if (raw.includes("強軋空")) trendStatus = "軋空主升段";
        if (raw.includes("模擬盤整")) trendStatus = "籌碼沉澱期";

        // 目標價 (僅針對趨勢盤)
        const target1 = extractValue(raw, /一飽.*：\s*([\d,.]+)/);
        const target2 = extractValue(raw, /二吐.*：\s*([\d,.]+)/);
        const target5 = extractValue(raw, /五倍.*：\s*([\d,.]+)/);

        // --- 生成文本 ---

        // 固定免責聲明
        let output = `【免責聲明】本人未持有證券投資顧問相關證照，所載內容僅屬個人技術分析學習紀錄與心得分享，不代表任何買賣建議或獲利保證；過去績效亦不代表未來表現，投資涉及風險，請務必獨立思考、審慎評估並自負盈虧。\n\n`;

        // 標題
        output += `【${stockName} 技術面學習筆記】\n\n`;

        // 第一段：現況
        output += `${stockName.split(/\d/)[0]}（${stockName.match(/\d+/)}）`;
        output += `當前市場價格收於 ${price} 元，依據盤態診斷結果，技術結構屬於${mode === 'trend' ? '明確的多頭趨勢' : '箱型震盪整理'}格局。`;
        
        if (mode === 'consolidation') {
            output += `股價波動區間明確界定於 ${boxBottom || '支撐'} 元之底部支撐與 ${boxTop || '壓力'} 元之頂部壓力之間。量能呈現收斂，反映市場觀望。`;
        } else {
            output += `此型態特徵在於股價處於主升段，行進過程伴隨震盪換手。目前的結構性絕對防守價位設定於 ${defense} 元，此為維繫整體上升架構之核心基準。`;
        }
        
        output += `只要收盤價能維持於此防守點之上，型態定調為${trendStatus}，整體趨勢並未改變。\n\n`;

        // 第二段：量價
        output += `觀察量價互動與關鍵價位，以五日平均成交量 ${avgVol} 張為計算基準，當前有效的攻擊量能門檻設定於 ${attackVol} 張。`;
        
        if (mode === 'trend') {
            output += `若成交量能持續擴張並達到攻擊門檻，將視為極強鎖攻訊號，有助於股價依據測幅原理依序挑戰 ${target1 || '前高'} 元、${target2 || '波段目標'} 元${target5 ? `，乃至波段終極目標 ${target5} 元` : ''}。`;
            output += `反之，若成交量縮減至 ${washVol} 張以下，在不跌破 ${defense} 元防守點的前提下，應解讀為籌碼沉澱之健康換手。\n\n`;
        } else {
            output += `若欲改變現狀，成交量能必須顯著放大至 ${attackVol} 張以上，方具備推升價格跨越箱體頂部之動能。`;
            output += `當前若量能低於 ${avgVol} 張，顯示動能銜接尚未達成，市場主力傾向於透過時間換取空間，藉此消化短線浮額。\n\n`;
        }

        // 第三段：推演
        output += `針對後市情境推演，`;
        if (mode === 'trend') {
            output += `若預估量能穩定維持在 ${attackVol} 張以上且價格持續推升，則確立多頭攻勢延續；`;
            output += `風險預警機制顯示，若單日成交量異常暴增（如2.0倍均量）且收黑 K 線，或是出現連續出量但價格高點停滯之背離現象，則暗示高檔籌碼鬆動。`;
            output += `一旦收盤價確認跌破 ${defense} 元，即觸發盤勢降級條件，顯示原始動能已無法支撐當前型態，下行風險將隨之大增。`;
        } else {
            output += `若價格能以帶量姿態（>${attackVol}張）突破關鍵壓力位，則視為確立多頭攻勢，盤整結束。`;
            output += `反之，若成交量持續低迷且股價維持在區間內，則該區域應定義為無效的時間成本消耗區。`;
            output += `必須警惕的是，若價格放量跌破 ${defense} 元，則技術型態將趨於弱化，下行風險將隨之大增。`;
        }

        output += `\n\n⚠️ 再次提醒\n以上純屬個人學習心得，每個人的分析方法、風險承受度都不同，請勿作為投資依據。建議諮詢專業投顧或自行深入研究後再做決定！`;

        // 顯示結果
        const outputDiv = document.getElementById('outputArea');
        outputDiv.innerText = output;
        document.getElementById('resultCard').style.display = 'block';
        outputDiv.style.display = 'block';
        document.getElementById('copyBtn').style.display = 'block';
        
        // 滾動到結果
        document.getElementById('resultCard').scrollIntoView({behavior: "smooth"});
    }

    function copyResult() {
        const outputText = document.getElementById('outputArea').innerText;
        navigator.clipboard.writeText(outputText).then(() => {
            const btn = document.getElementById('copyBtn');
            const originalText = btn.innerText;
            btn.innerText = "已複製！";
            btn.style.backgroundColor = "#2f855a";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.backgroundColor = "#48bb78";
            }, 2000);
        });
    }
</script>

</body>
</html>
